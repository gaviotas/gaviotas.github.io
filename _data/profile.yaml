headline: "Learning from imperfect data."

introduction: >-
  I am an AI researcher and Staff Engineer at Samsung Electronics' AX/PI Center.
  I study how visual models learn from limited, noisy, or indirect supervision,
  with an interest in making these methods useful beyond carefully annotated
  research datasets.

research_background: >-
  At Yonsei University, I worked with Prof.
  <a href="https://kaist-cvml.github.io/index.html" target="_blank" rel="noopener">Hyunjung Shim</a>
  on weakly supervised segmentation and localization, using image labels,
  point annotations, and saliency cues
  instead of dense pixel-level supervision. My work also spans language-guided
  and part-level segmentation, connecting visual regions with descriptions
  at different levels of detail. During my internship at NAVER AI Lab, I worked with
  <a href="https://8uos.github.io/" target="_blank" rel="noopener">Song Park</a>,
  <a href="https://sites.google.com/view/byeongho-heo/home" target="_blank" rel="noopener">Byeongho Heo</a>,
  and <a href="https://sites.google.com/site/dyhan0920/" target="_blank" rel="noopener">Dongyoon Han</a>
  on storage-efficient visual training, exploring how to reduce the data
  storage required for learning visual representations.

background: >-
  Today, I work on semiconductor data modeling and layout generation,
  where structured patterns and noisy data shape the design of learning
  systems. Across these settings, the common thread is learning useful
  structure from data that is costly to annotate, difficult to store,
  or imperfect in practice.

research_areas:
  - title: "Limited supervision"
    diagram: "supervision"
    description: >-
      Segmentation and localization using image labels, point annotations,
      and saliency cues.

  - title: "Visual representations"
    diagram: "representation"
    description: >-
      Language-guided segmentation and compact representations for
      storage-efficient visual training.

  - title: "Industrial applications"
    diagram: "layout"
    description: >-
      Semiconductor data modeling and generative methods for structured
      layout patterns.
