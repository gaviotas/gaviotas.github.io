headline: "Learning from Imperfect Data"

introduction: >-
  I work on <b>label-efficient visual learning</b>.
  My research asks how visual models can learn useful structure when data is
  costly to annotate, difficult to store, or imperfect in practice.
  I explore <span class="number-list">limited supervision</span> and
  <span class="number-list">compact representations</span>, spanning weakly
  supervised and language-guided segmentation, object localization, and
  storage-efficient training.

research_background: >-
  I received my M.S. and Ph.D. in Integrated Technology from <span class="affiliation-emphasis">Yonsei University</span>,
  advised by Prof.
  <a href="https://scholar.google.com/citations?user=KB5XZGIAAAAJ&hl=en" target="_blank" rel="noopener">Hyunjung Shim</a>.
  During my research internship at <span class="affiliation-emphasis">NAVER AI Lab</span>, I worked with
  <a href="https://8uos.github.io/" target="_blank" rel="noopener">Song Park</a>,
  <a href="https://sites.google.com/view/byeongho-heo/home" target="_blank" rel="noopener">Byeongho Heo</a>,
  and <a href="https://sites.google.com/site/dyhan0920/" target="_blank" rel="noopener">Dongyoon Han</a>
  on storage-efficient visual training.

background: >-
  I am currently an AI researcher and <b>Staff Engineer</b> at <span class="affiliation-emphasis">Samsung Electronics' AX/PI Center</span>,
  working on semiconductor data modeling and layout generation.
  These industrial settings bring the same research question into practice:
  learning from structured patterns and noisy data with limited supervision.

research_areas:
  - title: "Limited supervision"
    diagram: "supervision"
    description: >-
      Segmentation and localization using image labels, point annotations,
      and saliency cues.

  - title: "Visual representations"
    diagram: "representation"
    description: >-
      Language-guided segmentation and compact representations for
      storage-efficient visual training.

  - title: "Industrial applications"
    diagram: "layout"
    description: >-
      Semiconductor data modeling and generative methods for structured
      layout patterns.

